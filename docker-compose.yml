services:
  fpw:
    build:
      context: .
      dockerfile: Dockerfile
    image: tdulaz/zvar-fpw
    restart: always
    volumes:
      - /data/ztf/dev/zvar/data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    environment:
      - N_PROCESSES=1
      - TOTAL_CPU_CAP=0.8
      - CHUNK_CPU_CAP=0.8
      - GPU_CAP=0.9
      - N_GPUS=2
      - N_FREQ_BATCH=50000
